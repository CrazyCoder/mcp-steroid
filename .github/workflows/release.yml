name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          [ "v$base" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match VERSION $base"; exit 1; }

      - name: Build Docker build image
        run: docker build -t mcp-steroid-build:ci docker/build

      - name: Build plugin (Docker)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.gradle-home"
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GRADLE_USER_HOME=/build/.gradle-home \
            -e CI \
            -v "$GITHUB_WORKSPACE:/build" \
            -w /build \
            mcp-steroid-build:ci \
            ./gradlew :ij-plugin:buildPlugin -Pmcp.release.build=true --no-daemon --stacktrace

      - name: Assemble release assets
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          src="$(ls ij-plugin/build/distributions/mcp-steroid-plus-*.zip | head -1)"
          mkdir -p out
          cp "$src" "out/mcp-steroid-plus-$base.zip"
          cp "$src" out/mcp-steroid-plugin.zip
          (cd out && sha256sum mcp-steroid-plugin.zip > mcp-steroid-plugin.zip.sha256)
          release/scripts/make-release-json.sh out/mcp-steroid-plugin.zip "$base" > out/release.json
          cat out/release.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "MCP Steroid Plus ${GITHUB_REF_NAME#v}" \
            --notes-file "release/notes/${GITHUB_REF_NAME#v}.md"
